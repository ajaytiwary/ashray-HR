<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10243a"><title>ASHRAY HR & Payroll</title><link rel="manifest" href="../manifest.json"><style>
body{margin:0;background:#f3f6fa;color:#172536;font:15px system-ui}header{background:#10243a;color:white;padding:17px}main{max-width:800px;margin:auto;padding:16px}.card{background:white;border:1px solid #e1e8ef;border-radius:14px;padding:17px;margin:12px 0}input,button{font:inherit;padding:11px;border-radius:9px}input{width:100%;box-sizing:border-box;border:1px solid #ccd6e0;margin:5px 0 13px}button{border:0;background:#087eaf;color:white;font-weight:650;cursor:pointer}.secondary{background:#eaf2f8;color:#10243a}.muted{color:#718096;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{font-size:24px;font-weight:700}.hidden{display:none}.err{color:#b42335}.ok{color:#16865c}#appView{white-space:normal}@media(max-width:520px){main{padding:10px}}</style></head>
<body><header><b>ASHRAY HR & PAYROLL</b><div class="muted" style="color:#cbd5e1">Cloud Attendance • Payroll • Leave</div></header><main>
<section id="login" class="card"><h2>Secure Login</h2><p class="muted">Sign in using the account created by your ASHRAY administrator.</p><form id="loginForm"><label>Email</label><input name="email" type="email" required autocomplete="username"><label>Password</label><input name="password" type="password" required autocomplete="current-password"><button>Sign in</button></form><p id="loginMsg" class="muted"></p></section>
<section id="dashboard" class="hidden"><div class="card"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><div><h2 id="welcome">Welcome</h2><div id="role" class="muted"></div></div><button id="logout" class="secondary">Sign out</button></div></div><div id="appView"></div></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script><script src="./app.js"></script></body></html>
